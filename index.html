<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site status</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f7f8; --text:#12202b; --muted:#5d6b76; --rule:#dde3e7; --up:#12805c; --down:#c0392b; --line:#2f5d8a; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1519; --text:#e6edf1; --muted:#93a2ad; --rule:#26343c; --up:#3dd598; --down:#ff6b5e; --line:#7fb2e5; color-scheme: dark; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:40px 20px 60px; }
  h1 { font-size:clamp(26px,5vw,40px); line-height:1.1; margin:0 0 6px; letter-spacing:-0.02em; }
  h2 { font-size:20px; margin:44px 0 12px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .site { display:grid; grid-template-columns: 1.4fr .7fr .7fr 2fr; gap:8px 20px; align-items:center;
          padding:14px 0; border-top:1px solid var(--rule); }
  .name { font-weight:700; } .name a { color:inherit; text-decoration:none; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; background:var(--up); }
  .down .dot { background:var(--down); } .nodata .dot { background:var(--muted); }
  .stat small { display:block; color:var(--muted); font-size:13px; }
  .chart { height:46px; position:relative; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 10px 8px 0; border-top:1px solid var(--rule); }
  th { color:var(--muted); font-weight:500; font-size:14px; }
  .ongoing { color:var(--down); font-weight:600; }
  @media (max-width:700px) { .site { grid-template-columns:1fr 1fr; } .chart { grid-column:1/-1; } }
</style>
</head>
<body>
<main>
  <h1 id="headline">Checking sites…</h1>
  <p class="sub">Last 24 hours, checked every 5 minutes.</p>
  <div id="sites"></div>
  <h2>Incident history (last 7 days)</h2>
  <table>
    <thead><tr><th>Site</th><th>Problem</th><th>Started</th><th>Ended</th></tr></thead>
    <tbody id="incidents"></tbody>
  </table>
</main>

<script>
// Put your Function App URL here (see README).
const STATUS_URL = "https://YOUR-FUNCTION-APP.azurewebsites.net/api/status";
const charts = [];

// Build an element and set its text safely (never inserts raw HTML).
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const when = iso => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

function stat(value, label) {
  const d = el("div", "stat", value);
  d.append(el("small", null, label));
  return d;
}

function renderSite(s) {
  const state = !s.current ? "nodata" : s.current.ok ? "up" : "down";
  const row = el("div", "site " + state);

  const name = el("div", "name");
  const link = el("a", null, s.name);
  link.href = s.url; link.target = "_blank"; link.rel = "noopener noreferrer";
  name.append(el("span", "dot"), link);

  const box = el("div", "chart");
  const canvas = document.createElement("canvas");
  box.append(canvas);

  row.append(name,
    stat(s.uptime_24h == null ? "–" : s.uptime_24h + "%", "uptime"),
    stat(s.avg_ms == null ? "–" : s.avg_ms + " ms", "average"),
    box);

  charts.push(new Chart(canvas, {
    type: "line",
    data: { labels: s.series.map(p => when(p.t)),
            datasets: [{ data: s.series.map(p => p.ms), borderColor: getComputedStyle(document.documentElement).getPropertyValue("--line").trim(),
                         borderWidth: 1.5, pointRadius: 0, tension: 0.25 }] },   // null = gap in the line
    options: { responsive: true, maintainAspectRatio: false, animation: false,
               interaction: { mode: "index", intersect: false },
               plugins: { legend: { display: false },
                          tooltip: { callbacks: { label: c => c.parsed.y == null ? "Check failed" : c.parsed.y + " ms" } } },
               scales: { x: { display: false }, y: { display: false, beginAtZero: true } } }
  }));
  return row;
}

async function load() {
  try {
    const res = await fetch(STATUS_URL);
    if (!res.ok) throw new Error("API returned " + res.status);
    const data = await res.json();

    charts.splice(0).forEach(c => c.destroy());
    document.getElementById("sites").replaceChildren(...data.sites.map(renderSite));

    const down = data.sites.filter(s => s.current && !s.current.ok).map(s => s.name);
    document.getElementById("headline").textContent =
      down.length ? "Not responding: " + down.join(", ") : "All sites are responding";

    const rows = data.incidents.map(i => {
      const tr = el("tr");
      tr.append(el("td", null, i.site),
                el("td", null, i.kind === "outage" ? "Outage" : "Slowdown"),
                el("td", null, when(i.started)),
                el("td", i.ended ? "" : "ongoing", i.ended ? when(i.ended) : "Ongoing"));
      return tr;
    });
    if (!rows.length) { const tr = el("tr"); tr.append(el("td", null, "No incidents in the last 7 days.")); rows.push(tr); }
    document.getElementById("incidents").replaceChildren(...rows);
  } catch (err) {
    document.getElementById("headline").textContent = "Status unavailable";
    document.getElementById("sites").replaceChildren(
      el("p", null, "Couldn't load data (" + err.message + "). Check STATUS_URL in index.html and the Function App's CORS setting."));
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
